openapi: 3.1.0
info:
  description: 'GenAI service endpoints for flashcard generation. The /generate-flashcards
    endpoint streams NDJSON where each line is a Flashcard object. '
  title: GenAI Service API
  version: v1
servers:
- url: /
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Health Get
          description: Successful Response
      summary: Health
      tags:
      - default
  /api/v1/genai/uploads:
    post:
      description: Upload a PDF or TXT file and receive an upload id.
      operationId: api_v1_genai_uploads_post_api_v1_genai_uploads_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_api_v1_genai_uploads_post_api_v1_genai_uploads_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Successful Response
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Upload accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request or unsupported file format.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Uploaded file too large.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unsupported media type.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Server error during upload.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Upload a document for processing
      tags:
      - default
  /api/v1/genai/generate-flashcards:
    post:
      operationId: api_v1_genai_generate_flashcards_post_api_v1_genai_generate_flashcards_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_api_v1_genai_generate_flashcards_post_api_v1_genai_generate_flashcards_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/Flashcard"
          description: NDJSON stream of generated flashcards.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Server error during generation.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Generate flashcards from an uploaded document
      tags:
      - default
  /api/v1/genai/explain:
    post:
      description: Generate an explanation for a given flashcard.
      operationId: api_v1_genai_explain_post_api_v1_genai_explain_post
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/Flashcard"
              description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplanationResponse"
          description: Explanation for the flashcard.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Server error during explanation.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Explain a flashcard
      tags:
      - default
components:
  schemas:
    Body_api_v1_genai_generate_flashcards_post_api_v1_genai_generate_flashcards_post:
      properties:
        file:
          title: File
          type: string
      required:
      - file
      title: Body_api_v1_genai_generate_flashcards_post_api_v1_genai_generate_flashcards_post
    Body_api_v1_genai_uploads_post_api_v1_genai_uploads_post:
      properties:
        file:
          title: File
          type: string
      required:
      - file
      title: Body_api_v1_genai_uploads_post_api_v1_genai_uploads_post
    Error:
      description: Error
      example:
        code: code
        message: message
      properties:
        message:
          title: Message
          type: string
        code:
          nullable: true
          type: string
      required:
      - message
      title: Error
    ExplanationResponse:
      description: ExplanationResponse
      example:
        explanation: explanation
      properties:
        explanation:
          title: Explanation
          type: string
      required:
      - explanation
      title: ExplanationResponse
    Flashcard:
      description: Flashcard
      example:
        last_updated: 2000-01-23T04:56:07.000+00:00
        question: question
        answer: answer
        source_ref: source_ref
        id: id
      properties:
        id:
          description: Unique identifier for the flashcard.
          title: Id
          type: string
        question:
          title: Question
          type: string
        answer:
          title: Answer
          type: string
        source_ref:
          description: "Reference to the source segment (e.g., page or chunk id)."
          title: Source Ref
          type: string
        last_updated:
          format: date-time
          title: Last Updated
          type: string
      required:
      - answer
      - id
      - last_updated
      - question
      - source_ref
      title: Flashcard
    HTTPValidationError:
      example:
        detail:
        - msg: msg
          loc:
          - Location_inner
          - Location_inner
          input: ""
          ctx: "{}"
          type: type
        - msg: msg
          loc:
          - Location_inner
          - Location_inner
          input: ""
          ctx: "{}"
          type: type
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
    UploadResponse:
      description: UploadResponse
      example:
        upload_id: upload_id
      properties:
        upload_id:
          description: Identifier for the uploaded file.
          title: Upload Id
          type: string
      required:
      - upload_id
      title: UploadResponse
    ValidationError:
      example:
        msg: msg
        loc:
        - Location_inner
        - Location_inner
        input: ""
        ctx: "{}"
        type: type
      properties:
        loc:
          items:
            $ref: "#/components/schemas/Location_inner"
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
        input:
          title: Input
        ctx:
          title: Context
          type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Location_inner:
      anyOf:
      - type: string
      - type: integer
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
