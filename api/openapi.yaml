openapi: 3.0.3

info:
  title: Flashcard API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /api/v1/auth/register:
    post:
      summary: Register new user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '200':
          description: User registered successfully

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/login:
    post:
      summary: Login user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login successful

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

components:

  schemas:

    RegisterRequest:
      type: object

      properties:
        username:
          type: string

        email:
          type: string

        password:
          type: string

      required:
        - username
        - email
        - password

    LoginRequest:
      type: object

      properties:
        email:
          type: string

        password:
          type: string

      required:
        - email
        - password

    AuthResponse:
      type: object

      properties:
        token:
          type: string

        username:
          type: string