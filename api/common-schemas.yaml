components:
  schemas:
    Flashcard:
      type: object
      required:
        - id
        - question
        - answer
        - source_ref
        - last_updated
      properties:
        id:
          type: string
          description: Unique identifier for the flashcard.
        question:
          type: string
        answer:
          type: string
        source_ref:
          type: string
          description: Reference to the source segment (e.g., page or chunk id).
        last_updated:
          type: string
          format: date-time
