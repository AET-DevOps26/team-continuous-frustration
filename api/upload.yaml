openapi: 3.1.0
info:
  description: Document Upload service endpoints
  title: Document Upload Service API
  version: v1
servers:
- url: /
paths:
  /api/v1/documents/health:
    get:
      operationId: health_api_v1_documents_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Api V1 Documents Health Get
          description: Successful Response
      summary: Health
      tags:
      - default
  /api/v1/documents/upload:
    post:
      description: Upload a PDF or TXT file and receive an upload id.
      operationId: documents_upload_post_api_v1_documents_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_documents_upload_post_api_v1_documents_upload_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Successful Response
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Upload accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request or unsupported file format.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Uploaded file too large.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unsupported media type.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Server error during upload.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Upload a document for processing
      tags:
      - default
  /api/v1/documents/{upload_id}:
    get:
      description: Get a document
      operationId: documents_get_api_v1_documents__upload_id__get
      parameters:
      - explode: false
        in: path
        name: upload_id
        required: true
        schema:
          title: Upload Id
          type: string
        style: simple
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Document retrieved successfully.
        "400":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request.
        "404":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
          description: Document not found.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get a document
      tags:
      - default
components:
  schemas:
    Body_documents_upload_post_api_v1_documents_upload_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_documents_upload_post_api_v1_documents_upload_post
    Error:
      description: Error
      example:
        code: code
        message: message
      properties:
        message:
          title: Message
          type: string
        code:
          nullable: true
          type: string
      required:
      - message
      title: Error
    HTTPValidationError:
      example:
        detail:
        - msg: msg
          loc:
          - Location_inner
          - Location_inner
          type: type
        - msg: msg
          loc:
          - Location_inner
          - Location_inner
          type: type
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
    UploadResponse:
      description: UploadResponse
      example:
        upload_id: upload_id
      properties:
        upload_id:
          description: Identifier for the uploaded file.
          title: Upload Id
          type: string
      required:
      - upload_id
      title: UploadResponse
    ValidationError:
      example:
        msg: msg
        loc:
        - Location_inner
        - Location_inner
        type: type
      properties:
        loc:
          items:
            $ref: "#/components/schemas/Location_inner"
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Location_inner:
      anyOf:
      - type: string
      - type: integer
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
