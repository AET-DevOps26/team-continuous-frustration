openapi: 3.0.3

info:
  title: Team Continuous Frustration API
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.team-continuous-frustration.com
    description: Production

paths:
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and auth cookies were issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get the currently authenticated user
      operationId: getMe
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Authenticated user info from the access token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: No valid session

  /api/v1/auth/refresh:
    post:
      summary: Refresh the access token from the current session
      operationId: refresh
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Access token refreshed and cookie reissued
        '401':
          description: Missing, invalid, or expired session

  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      tags:
        - Auth
      security: []
      responses:
        '204':
          description: Session revoked and auth cookies cleared

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: secret123

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: secret123
        username:
          type: string
          minLength: 3
          example: john_doe

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: john_doe

    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: john_doe

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: EMAIL_ALREADY_EXISTS
        message:
          type: string
          example: A user with this email already exists
        details:
          type: object
          additionalProperties: true
