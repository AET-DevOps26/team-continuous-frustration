apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.azure.yml convert -c -n team-continuous-frustration
    kompose.version: 1.38.0 (HEAD)
    traefik.enable: "true"
    traefik.http.routers.webclient.entrypoints: websecure
    traefik.http.routers.webclient.priority: "1"
    traefik.http.routers.webclient.rule: Host(``)
    traefik.http.routers.webclient.tls.certresolver: letsencrypt
    traefik.http.services.webclient.loadbalancer.server.port: "80"
  labels:
    io.kompose.service: web-client
  name: web-client
  namespace: team-continuous-frustration
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web-client
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.azure.yml convert -c -n team-continuous-frustration
        kompose.version: 1.38.0 (HEAD)
        traefik.enable: "true"
        traefik.http.routers.webclient.entrypoints: websecure
        traefik.http.routers.webclient.priority: "1"
        traefik.http.routers.webclient.rule: Host(``)
        traefik.http.routers.webclient.tls.certresolver: letsencrypt
        traefik.http.services.webclient.loadbalancer.server.port: "80"
      labels:
        io.kompose.service: web-client
    spec:
      containers:
        - image: ghcr.io/aet-devops26/team-continuous-frustration/web-client:latest
          name: web-client
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
