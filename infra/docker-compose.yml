services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
      target: dev
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5273}
    volumes:
      - ../services/auth-service:/app/services/auth-service
      - ../api:/app/api
      - maven_cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy

  flashcard-service:
    build:
      context: ..
      dockerfile: services/flashcard-service/Dockerfile
      target: dev
    ports:
      - "${FLASHCARD_SERVICE_PORT}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../services/flashcard-service:/app/services/flashcard-service
      - ../api:/app/api
      - maven_cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy

  genai-service:
    build:
      context: ../services/genai-service
      dockerfile: Dockerfile
      target: service
    ports:
      - "${GENAI_SERVICE_PORT}:8090"
    environment:
      LOGOS_API_KEY: ${LOGOS_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_API_ENDPOINT: http://ollama:11434
    volumes:
      - ../services/genai-service:/app
    depends_on:
      - weaviate
      - ollama

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-ollama'
      CLUSTER_HOSTNAME: 'node1'
      OLLAMA_API_ENDPOINT: 'http://ollama:11434'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.30.8
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama.sh:/ollama.sh
    entrypoint: ["/bin/sh", "/ollama.sh"]

  web-client:
    build:
      context: ../web-client
      target: dev
    ports:
      - "5273:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../web-client:/app
      - web_client_node_modules:/app/node_modules
    depends_on:
      - auth-service
      - flashcard-service

volumes:
  postgres_data:
  weaviate_data:
  ollama_data:
  maven_cache:
  web_client_node_modules:
