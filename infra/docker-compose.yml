services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8083:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      db:
        condition: service_healthy

  flashcard-service:
    build:
      context: ..
      dockerfile: services/flashcard-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: flashcard
      SPRING_DATASOURCE_PASSWORD: flashcard
    depends_on:
      db:
        condition: service_healthy

  web-client:
    build:
      context: ../web-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8083
    depends_on:
      - auth-service
      - flashcard-service

volumes:
  postgres_data:
