services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashcarddb
      POSTGRES_USER: flashcard
      POSTGRES_PASSWORD: flashcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flashcard-service:
    build:
      context: ..
      dockerfile: services/flashcard-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: flashcard
      SPRING_DATASOURCE_PASSWORD: flashcard
    depends_on:
      - db

  web-client:
    build:
      context: ../web-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081
    depends_on:
      - flashcard-service

volumes:
  postgres_data:
