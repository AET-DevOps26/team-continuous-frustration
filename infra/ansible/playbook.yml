---
- name: Deploy team-continuous-frustration project to Azure VM
  hosts: azure_vm
  become: true

  vars:
    app_dir: "/home/{{ ansible_user }}/team-continuous-frustration"
    infra_dir: "{{ app_dir }}/infra"
    env_file: "/home/{{ ansible_user }}/.env.prod"
    compose_file: "{{ infra_dir }}/docker-compose.azure.yml"

  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - lsb-release
        state: present

    - name: Create Docker apt key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker official GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

    - name: Ensure infra directory exists on VM
      ansible.builtin.file:
        path: "{{ infra_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy docker-compose file to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.azure.yml"
        dest: "{{ infra_dir }}/docker-compose.azure.yml"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy Ollama entrypoint script to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../init-ollama/ollama.sh"
        dest: "{{ infra_dir }}/init-ollama/ollama.sh"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy database init scripts to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../init-db/"
        dest: "{{ infra_dir }}/init-db/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy Prometheus config to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../prometheus/"
        dest: "{{ infra_dir }}/prometheus/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy Loki config to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../loki/"
        dest: "{{ infra_dir }}/loki/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy Promtail config to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../promtail/"
        dest: "{{ infra_dir }}/promtail/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Copy Grafana provisioning config to VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../grafana/"
        dest: "{{ infra_dir }}/grafana/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Ensure Traefik dynamic config directory exists
      ansible.builtin.file:
        path: "{{ infra_dir }}/traefik/dynamic"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Render Traefik dynamic config (monitoring basic auth)
      ansible.builtin.template:
        src: templates/traefik-dynamic.yml.j2
        dest: "{{ infra_dir }}/traefik/dynamic/monitoring-auth.yml"
        owner: "{{ ansible_user }}"
        mode: "0600"
      no_log: true

    - name: Render production environment file
      ansible.builtin.template:
        src: templates/env.prod.j2
        dest: "{{ env_file }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
      no_log: true

    - name: Verify production environment file was written
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_file_stat

    - name: Fail if production environment file is missing or empty
      ansible.builtin.fail:
        msg: "{{ env_file }} is missing or empty"
      when: not env_file_stat.stat.exists or env_file_stat.stat.size == 0

    - name: Log in to GitHub Container Registry
      ansible.builtin.shell: docker login ghcr.io -u "{{ github_actor }}" --password-stdin
      args:
        stdin: "{{ github_token }}"
      no_log: true
      changed_when: true

    - name: Deploy application stack with Docker Compose
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_file }} --env-file {{ env_file }}
          up --pull=always -d --remove-orphans
        chdir: "{{ infra_dir }}"
      changed_when: true

    - name: Remove dangling Docker resources
      ansible.builtin.command:
        cmd: docker system prune -af
      register: prune_result
      changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"

