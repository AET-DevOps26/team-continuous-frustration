---
- name: Deploy team-continuous-frustration project to Azure VM
  hosts: azure_vm
  become: true

  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - lsb-release
        state: present

    - name: Create Docker apt key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker official GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

    - name: Clone or update project repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_branch }}"
        force: true
        update: true

    - name: Create .env file from Ansible variable
      ansible.builtin.copy:
        dest: "{{ repo_dest }}/infra/.env"
        content: "{{ env_file_content }}"
        owner: azureuser
        group: azureuser
        mode: "0600"

    - name: Stop existing Docker Compose services
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} --env-file infra/.env down
        chdir: "{{ repo_dest }}"
      ignore_errors: true

    - name: Build and start Docker Compose services
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} --env-file infra/.env up --build -d
        chdir: "{{ repo_dest }}"

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps_output

    - name: Print running containers
      ansible.builtin.debug:
        var: docker_ps_output.stdout_lines
