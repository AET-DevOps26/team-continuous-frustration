apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.jaeger.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        monitoring: "true"
    spec:
      # jaegertracing/all-in-one runs as a non-root user (uid 10001) that
      # can't write to a freshly provisioned PVC (root-owned by default),
      # causing "mkdir /badger/key: permission denied". fsGroup makes
      # Kubernetes chgrp the volume to this GID on mount so the container
      # can write to it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
          ports:
            - name: ui
              containerPort: 16686
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: jaeger-thrift
              containerPort: 14268
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.jaeger.resources.requests.cpu | quote }}
              memory: {{ .Values.jaeger.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.jaeger.resources.limits.cpu | quote }}
              memory: {{ .Values.jaeger.resources.limits.memory | quote }}
          volumeMounts:
            - name: jaeger-data
              mountPath: /badger
      volumes:
        - name: jaeger-data
          persistentVolumeClaim:
            claimName: jaeger-data
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: {{ .Values.namespace }}
  labels:
    app: jaeger
    monitoring: "true"
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: jaeger-thrift
      port: 14268
      targetPort: jaeger-thrift
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.basicAuthSecretName }}
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - jaeger.{{ .Values.ingress.domain }}
      secretName: monitoring-jaeger-tls
  rules:
    - host: jaeger.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686
{{- end }}
