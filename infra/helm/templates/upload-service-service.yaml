apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: {{ .Values.uploadService.name }}
    app: {{ .Values.uploadService.name }}
    monitoring: "true"
  name: {{ .Values.uploadService.name }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: {{ .Values.uploadService.port | quote }}
      port: {{ .Values.uploadService.port }}
      targetPort: {{ .Values.uploadService.port }}
    - name: {{ .Values.uploadService.port | quote }}
      port: {{ .Values.uploadService.port }}
      targetPort: {{ .Values.uploadService.port }}
  selector:
    io.kompose.service: {{ .Values.uploadService.name }}
    io.kompose.service: {{ .Values.uploadService.name }}
