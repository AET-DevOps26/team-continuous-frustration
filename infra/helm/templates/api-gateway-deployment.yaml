apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.azure.yml convert -c -n team-continuous-frustration
    kompose.version: 1.38.0 (HEAD)
    traefik.enable: "true"
    traefik.http.middlewares.gateway-compress.compress: "true"
    traefik.http.routers.gateway.entrypoints: websecure
    traefik.http.routers.gateway.middlewares: gateway-compress
    traefik.http.routers.gateway.priority: "10"
    traefik.http.routers.gateway.rule: Host(``) && PathPrefix(`/api`)
    traefik.http.routers.gateway.tls.certresolver: letsencrypt
    traefik.http.services.gateway.loadbalancer.server.port: "8080"
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
  namespace: team-continuous-frustration
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-gateway
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.azure.yml convert -c -n team-continuous-frustration
        kompose.version: 1.38.0 (HEAD)
        traefik.enable: "true"
        traefik.http.middlewares.gateway-compress.compress: "true"
        traefik.http.routers.gateway.entrypoints: websecure
        traefik.http.routers.gateway.middlewares: gateway-compress
        traefik.http.routers.gateway.priority: "10"
        traefik.http.routers.gateway.rule: Host(``) && PathPrefix(`/api`)
        traefik.http.routers.gateway.tls.certresolver: letsencrypt
        traefik.http.services.gateway.loadbalancer.server.port: "8080"
      labels:
        io.kompose.service: api-gateway
    spec:
      containers:
        - env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: CORS_ALLOWED_ORIGINS
              value: https://team-continuous-frustration-devops-ss26.stud.k8s.aet.cit.tum.de
            - name: FLASHCARD_SERVICE_URL
              value: http://flashcard-service:8082
            - name: GENAI_SERVICE_URL
              value: http://genai-service:8080
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.net.preferIPv4Stack=true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: UPLOAD_SERVICE_URL
              value: http://upload-service:8091
          image: ghcr.io/aet-devops26/team-continuous-frustration/api-gateway:latest
          name: api-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
      restartPolicy: Always
