services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/auth-service:latest
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: https://${CLIENT_HOST}
    depends_on:
      db:
        condition: service_healthy

  flashcard-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/flashcard-service:latest
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flashcards.rule=Host(`${SERVER_HOST}`) && (PathPrefix(`/api/v1/flashcards`) || PathPrefix(`/api/v1/flashcard`))"
      - "traefik.http.routers.flashcards.entrypoints=websecure"
      - "traefik.http.routers.flashcards.tls.certresolver=letsencrypt"
      - "traefik.http.services.flashcards.loadbalancer.server.port=8082"
      - "traefik.http.routers.flashcards.priority=3"
    depends_on:
      db:
        condition: service_healthy

  genai-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/genai-service:latest
    expose:
      - "8080"
    command: uvicorn openapi_server.main:app --host 0.0.0.0 --port 8080
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genai.rule=Host(`${SERVER_HOST}`) && PathPrefix(`/api/v1/genai`)"
      - "traefik.http.routers.genai.entrypoints=websecure"
      - "traefik.http.routers.genai.tls.certresolver=letsencrypt"
      - "traefik.http.services.genai.loadbalancer.server.port=8080"
      - "traefik.http.routers.genai.priority=2"

  upload-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/upload-service:latest
    expose:
      - "8091"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: uploaddocumentdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  web-client:
    image: ghcr.io/aet-devops26/team-continuous-frustration/web-client:latest
    expose:
      - "80"
    depends_on:
      - auth-service
      - flashcard-service
    restart: unless-stopped

  api-gateway:
    image: ghcr.io/aet-devops26/team-continuous-frustration/api-gateway:latest
    ports:
      - "80:8080"
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      FLASHCARD_SERVICE_URL: http://flashcard-service:8082
      GENAI_SERVICE_URL: http://genai-service:8090
      WEB_CLIENT_URL: http://web-client:80
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - auth-service
      - flashcard-service
      - genai-service
      - web-client
    restart: unless-stopped

volumes:
  postgres_data:
