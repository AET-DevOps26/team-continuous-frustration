services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/auth-service:latest
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SESSION_EXPIRATION_MS: ${SESSION_EXPIRATION_MS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy

  flashcard-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/flashcard-service:latest
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  genai-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/genai-service:latest
    expose:
      - "8080"
    environment:
      LOGOS_API_KEY: ${LOGOS_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_API_ENDPOINT: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - weaviate
      - ollama
      - upload-service

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    expose:
      - "8080"
      - "50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-ollama'
      CLUSTER_HOSTNAME: 'node1'
      OLLAMA_API_ENDPOINT: 'http://ollama:11434'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.30.8
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama.sh:/ollama.sh
    entrypoint: ["/bin/sh", "/ollama.sh"]

  upload-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/upload-service:latest
    expose:
      - "8091"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: uploaddocumentdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/aet-devops26/team-continuous-frustration/api-gateway:latest
    expose:
      - "8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      FLASHCARD_SERVICE_URL: http://flashcard-service:8082
      GENAI_SERVICE_URL: http://genai-service:8080
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - auth-service
      - flashcard-service
    restart: unless-stopped

  web-client:
    image: ghcr.io/aet-devops26/team-continuous-frustration/web-client:latest
    expose:
      - "80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/generate-certs.sh:/generate-certs.sh:ro
      - nginx_certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/generate-certs.sh"]
    depends_on:
      - api-gateway
      - web-client
    restart: unless-stopped

volumes:
  postgres_data:
  weaviate_data:
  ollama_data:
  nginx_certs:
