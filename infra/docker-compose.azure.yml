services:
  reverse-proxy:
    image: traefik:v3.6.15
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@tum.de"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/auth-service:latest
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      SESSION_EXPIRATION_MS: ${SESSION_EXPIRATION_MS:-31536000000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      FRONTEND_URL: https://${FRONTEND_URL:-localhost}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: https://${FRONTEND_URL:-localhost}/login/oauth2/code/google
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  flashcard-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/flashcard-service:latest
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flashcarddb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  genai-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/genai-service:latest
    expose:
      - "8090"
    environment:
      LOGOS_API_KEY: ${LOGOS_API_KEY:-placeholder}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://placeholder}
      LLM_MODEL: ${LLM_MODEL:-placeholder}
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_API_ENDPOINT: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - weaviate
      - ollama
      - upload-service

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    expose:
      - "8080"
      - "50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-ollama'
      CLUSTER_HOSTNAME: 'node1'
      OLLAMA_API_ENDPOINT: 'http://ollama:11434'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.30.8
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./init-ollama/ollama.sh:/init-ollama/ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama/ollama.sh"]

  upload-service:
    image: ghcr.io/aet-devops26/team-continuous-frustration/upload-service:latest
    expose:
      - "8091"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: uploaddocumentdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/aet-devops26/team-continuous-frustration/api-gateway:latest
    expose:
      - "8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      FLASHCARD_SERVICE_URL: http://flashcard-service:8082
      GENAI_SERVICE_URL: http://genai-service:8090
      UPLOAD_SERVICE_URL: http://upload-service:8091
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    depends_on:
      auth-service:
        condition: service_healthy
      flashcard-service:
        condition: service_started
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${FRONTEND_URL}`) && (PathPrefix(`/api`) || PathPrefix(`/oauth2`) || PathPrefix(`/login/oauth2`))"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.gateway-compress.compress=true"
      - "traefik.http.routers.gateway.middlewares=gateway-compress"
      - "traefik.http.routers.gateway.priority=10"

  web-client:
    image: ghcr.io/aet-devops26/team-continuous-frustration/web-client:latest
    expose:
      - "80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webclient.rule=Host(`${FRONTEND_URL}`)"
      - "traefik.http.services.webclient.loadbalancer.server.port=80"
      - "traefik.http.routers.webclient.entrypoints=websecure"
      - "traefik.http.routers.webclient.tls.certresolver=letsencrypt"
      - "traefik.http.routers.webclient.priority=1"

volumes:
  postgres_data:
  weaviate_data:
  ollama_data:
