server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
spring.application.name=auth-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://jaeger:4318/v1/traces}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${FRONTEND_URL}/login/oauth2/code/google

frontend.url=${FRONTEND_URL:http://localhost:5273}

session.expiration-ms=${SESSION_EXPIRATION_MS:31536000000}
