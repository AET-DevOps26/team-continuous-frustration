server.port=${SERVER_PORT:8083}
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}
spring.application.name=study-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://jaeger:4318/v1/traces}

spring.datasource.url=jdbc:postgresql://localhost:5432/studydb
spring.datasource.username=study
spring.datasource.password=study
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

study.ease.default=${STUDY_EASE_DEFAULT:2.5}
study.ease.min=${STUDY_EASE_MIN:1.3}
study.ease.again-penalty=${STUDY_EASE_AGAIN_PENALTY:0.20}
study.ease.hard-penalty=${STUDY_EASE_HARD_PENALTY:0.15}
study.ease.easy-bonus=${STUDY_EASE_EASY_BONUS:0.15}
study.hard-first-step-minutes=${STUDY_HARD_FIRST_STEP_MINUTES:10}
