databaseChangeLog:
  - changeSet:
      id: 002_create_deck_tags
      author: team-continuous-frustration
      changes:
        - createTable:
            tableName: deck_tags
            columns:
              - column:
                  name: deck_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deck_tags_deck
                    references: decks(id)
                    deleteCascade: true
              - column:
                  name: tag_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: tag
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: deck_tags
            columnNames: deck_id, tag_order
            constraintName: pk_deck_tags
