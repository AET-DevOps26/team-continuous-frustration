server.port=${SERVER_PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.application.name=flashcard-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anki_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anki_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:anki_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:team-continuous-frustration-ai-based-anki-secret-key-for-dev-only}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

genai.service.url=${GENAI_SERVICE_URL:http://localhost:8001}