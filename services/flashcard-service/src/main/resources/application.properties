server.port=${SERVER_PORT:8082}
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}
spring.application.name=flashcard-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://jaeger:4318/v1/traces}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashcarddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flashcard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flashcard}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
