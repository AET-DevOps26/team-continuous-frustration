server:
  port: 8080

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**,/oauth2/**,/login/oauth2/**
        - id: flashcard-service
          uri: ${FLASHCARD_SERVICE_URL:http://flashcard-service:8082}
          predicates:
            - Path=/api/v1/flashcards,/api/v1/flashcards/**
        - id: genai-service
          uri: ${GENAI_SERVICE_URL:http://genai-service:8090}
          predicates:
            - Path=/api/v1/genai/**
        - id: upload-service
          uri: ${UPLOAD_SERVICE_URL:http://upload-service:8091}
          predicates:
            - Path=/api/v1/documents/**


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://jaeger:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
