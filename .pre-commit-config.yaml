repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        name: ruff (GenAI)
        files: ^services/.*/src/.*\.py$
        types_or: [python]
        args:
          - --fix
      - id: ruff-format
        name: ruff-format (GenAI)
        files: ^services/.*/src/.*\.py$
        types_or: [python]
        
  - repo: local
    hooks:
      - id: no-empty-commit-message
        name: no-empty-commit-message
        entry: bash
        language: system
        stages: [commit-msg]
        pass_filenames: true
        args:
          - -c
          - |
            if ! grep -q '[^[:space:]]' "$1"; then
              echo "Commit message cannot be empty or whitespace only."
              exit 1
            fi
          - --

