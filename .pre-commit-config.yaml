repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        name: ruff (GenAI)
        files: ^services/.*/src/.*\.py$
        types_or: [python]
        args:
          - --fix
      - id: ruff-format
        name: ruff-format (GenAI)
        files: ^services/.*/src/.*\.py$
        types_or: [python]
        
  - repo: local
    hooks:
      - id: flashcard-mvn-test
        name: Maven test (flashcard-service)
        entry: bash -c 'cd services/flashcard-service && mvn test -q 2>&1'
        language: system
        files: ^services/flashcard-service/.*\.(java|xml|properties)$
        pass_filenames: false

      - id: no-empty-commit-message
        name: no-empty-commit-message
        entry: bash
        language: system
        stages: [commit-msg]
        pass_filenames: true
        args:
          - -c
          - |
            if ! grep -q '[^[:space:]]' "$1"; then
              echo "Commit message cannot be empty or whitespace only."
              exit 1
            fi
          - --

