repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(services/genai-service/src/openapi_server/(apis|models)/|web-client/src/api/)
      - id: end-of-file-fixer
        exclude: ^(services/genai-service/src/openapi_server/(apis|models)/|web-client/src/api/)
      - id: check-yaml
        exclude: ^(services/genai-service/src/openapi_server/(apis|models)/|web-client/src/api/)
      - id: check-added-large-files
        exclude: ^(services/genai-service/src/openapi_server/(apis|models)/|web-client/src/api/)
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        exclude: ^(services/genai-service/src/openapi_server/(apis|models)/|web-client/src/api/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        name: ruff (GenAI)
        files: ^services/.*/src/.*\.py$
        exclude: ^services/genai-service/src/openapi_server/(apis|models)/
        types_or: [python]
        args:
          - --fix
      - id: ruff-format
        name: ruff-format (GenAI)
        files: ^services/.*/src/.*\.py$
        exclude: ^services/genai-service/src/openapi_server/(apis|models)/
        types_or: [python]

  - repo: local
    hooks:
      - id: openapi-cli-lint
        name: Lint OpenAPI spec
        entry: npx @redocly/cli lint
        language: system
        files: ^api/auth\.yaml$
        pass_filenames: true

  - repo: local
    hooks:
      - id: flashcard-mvn-test
        name: Maven test (flashcard-service)
        entry: bash -c 'cd services/flashcard-service && mvn test -q 2>&1'
        language: system
        files: ^services/flashcard-service/(src/.*\.java|pom\.xml)$
        pass_filenames: false

      - id: conventional-commit-message
        name: Validate commit message format
        entry: bash
        language: system
        stages: [commit-msg]
        pass_filenames: true
        args:
          - -c
          - |
            if ! grep -qE '^(feat|fix|refactor|docs): .+$' "$1"; then
              echo "Commit message must match: ^(feat|fix|refactor|docs): .+$"
              echo "Examples: 'feat: add login endpoint', 'fix: correct password hashing'"
              exit 1
            fi
          - --
