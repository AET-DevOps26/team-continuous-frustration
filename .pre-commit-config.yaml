repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        name: ruff (GenAI)
        files: ^apps/GenAI/src/.*\.py$
        types_or: [python]
        args:
          - --fix
      - id: ruff-format
        name: ruff-format (GenAI)
        files: ^apps/GenAI/src/.*\.py$
        types_or: [python]
