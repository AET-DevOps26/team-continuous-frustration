name: Deploy Kubernetes

on:
  # Manual trigger (deploy any branch on demand).
  workflow_dispatch:
  # Continuous Deployment: run automatically once images are (re)built on main.
  # Chaining off "Build Docker Images" ensures the freshly built :latest images
  # exist before we roll out.
  workflow_run:
    workflows: ["Build Docker Images"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For the automatic (workflow_run) trigger, only deploy when the build
    # actually succeeded. Manual dispatches always run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: Kubernetes
      url: 'https://team-continuous-frustration-devops-ss26.stud.k8s.aet.cit.tum.de'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      # app-secrets / grafana-admin-credentials / monitoring-basic-auth are
      # externally managed (not templated by either Helm chart - see
      # infra/helm/README.md and infra/helm-monitoring/README.md) and must
      # exist before the corresponding `helm upgrade --install` runs.
      # `--dry-run=client -o yaml | kubectl apply` makes this create-or-update
      # so re-running the workflow on an already-provisioned cluster is safe.
      - name: Create/update application secrets
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl create namespace team-continuous-frustration \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secrets \
            --namespace team-continuous-frustration \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=POSTGRES_USER="${{ vars.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=LOGOS_API_KEY="${{ secrets.LOGOS_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update monitoring secrets
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl create namespace team-continuous-frustration-monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic grafana-admin-credentials \
            --namespace team-continuous-frustration-monitoring \
            --from-literal=admin-user="${{ vars.GRAFANA_ADMIN_USER }}" \
            --from-literal=admin-password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic monitoring-basic-auth \
            --namespace team-continuous-frustration-monitoring \
            --from-literal=auth="${{ secrets.MONITORING_BASIC_AUTH_USERS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy observability stack (infra/helm-monitoring)
        working-directory: infra/helm-monitoring
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          helm dependency update
          helm upgrade --install monitoring . \
            --namespace team-continuous-frustration-monitoring \
            --values values.yaml \
            --wait --timeout 5m

      - name: Deploy application stack (infra/helm)
        working-directory: infra/helm
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          helm upgrade --install tcf . \
            --namespace team-continuous-frustration \
            --values values.yaml \
            --wait --timeout 5m

      # imagePullPolicy: Always + a static ":latest" tag means a Deployment's
      # pod spec never actually changes between builds, so `helm upgrade`
      # above won't trigger a new rollout on its own - force one so the
      # freshly built images actually get pulled.
      - name: Restart app deployments to pull latest images
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl rollout restart deployment \
            api-gateway auth-service flashcard-service study-service \
            genai-service upload-service web-client \
            -n team-continuous-frustration
          kubectl rollout status deployment/api-gateway -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/auth-service -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/flashcard-service -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/study-service -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/genai-service -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/upload-service -n team-continuous-frustration --timeout=120s
          kubectl rollout status deployment/web-client -n team-continuous-frustration --timeout=120s

      - name: Clean up kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
