name: Build Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web-client:
              - 'web-client/**'
            auth-service:
              - 'services/auth-service/**'
            flashcard-service:
              - 'services/flashcard-service/**'
            genai-service:
              - 'services/genai-service/**'
            workflow:
              - '.github/workflows/build_docker.yaml'

      - name: Build matrix from changes
        id: set-matrix
        uses: actions/github-script@v7
        env:
          WEB_CLIENT: ${{ steps.filter.outputs.web-client }}
          AUTH_SERVICE: ${{ steps.filter.outputs.auth-service }}
          FLASHCARD_SERVICE: ${{ steps.filter.outputs.flashcard-service }}
          GENAI_SERVICE: ${{ steps.filter.outputs.genai-service }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        with:
          script: |
            const items = [];
            const add = (service, context, dockerfile) => items.push({ service, context, dockerfile });
            const buildAll = process.env.WORKFLOW === 'true';

            if (buildAll || process.env.WEB_CLIENT === 'true') {
              add('web-client', './web-client', './web-client/Dockerfile');
            }
            if (buildAll || process.env.AUTH_SERVICE === 'true') {
              add('auth-service', '.', './services/auth-service/Dockerfile');
            }
            if (buildAll || process.env.FLASHCARD_SERVICE === 'true') {
              add('flashcard-service', '.', './services/flashcard-service/Dockerfile');
            }
            if (buildAll || process.env.GENAI_SERVICE === 'true') {
              add('genai-service', './services/genai-service', './services/genai-service/Dockerfile');
            }

            core.setOutput('matrix', JSON.stringify({ include: items }));
            core.setOutput('has_changes', items.length > 0 ? 'true' : 'false');

  build:
    name: Build Docker Images
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
