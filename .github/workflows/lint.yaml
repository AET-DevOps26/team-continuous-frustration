name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  eslint:
    name: web-client (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  ruff:
    name: ${{ matrix.service }} (ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - genai-service
          - upload-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install --no-cache-dir ruff

      - name: Ruff
        working-directory: services/${{ matrix.service }}
        run: ruff check src
