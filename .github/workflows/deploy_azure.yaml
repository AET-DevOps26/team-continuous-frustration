name: Deploy Docker Images

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Azure
      url: 'https://${{ vars.AZURE_PUBLIC_IP }}.nip.io'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install --disable-pip-version-check ansible

      - name: Configure SSH key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/azure_key.pem"
          echo "${{ secrets.AZURE_PRIVATE_KEY }}" > "$RUNNER_TEMP/azure_key.pem"

      - name: Generate Ansible inventory
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/inventory.ini"
          cat > "$RUNNER_TEMP/inventory.ini" <<EOF
          [azure_vm]
          ${{ vars.AZURE_PUBLIC_IP }} ansible_user=${{ vars.AZURE_USER }} ansible_ssh_private_key_file=$RUNNER_TEMP/azure_key.pem
          EOF

      - name: Generate Ansible extra-vars file
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/vars.yml"
          cat > "$RUNNER_TEMP/vars.yml" <<'EOF'
          azure_public_ip: "${{ vars.AZURE_PUBLIC_IP }}"
          github_actor: "${{ github.actor }}"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          postgres_user: "${{ vars.POSTGRES_USER }}"
          postgres_password: "${{ secrets.POSTGRES_PASSWORD }}"
          jwt_secret: "${{ secrets.JWT_SECRET }}"
          jwt_expiration_ms: "${{ vars.JWT_EXPIRATION_MS }}"
          session_expiration_ms: "${{ vars.SESSION_EXPIRATION_MS }}"
          google_client_id: "${{ secrets.GOOGLE_CLIENT_ID }}"
          google_client_secret: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          logos_api_key: "${{ secrets.LOGOS_API_KEY }}"
          llm_base_url: "${{ vars.LLM_BASE_URL }}"
          llm_model: "${{ vars.LLM_MODEL }}"
          grafana_admin_user: "${{ vars.GRAFANA_ADMIN_USER }}"
          grafana_admin_password: "${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          monitoring_basic_auth_users: "${{ secrets.MONITORING_BASIC_AUTH_USERS }}"
          EOF

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.ini" \
            infra/ansible/playbook.yml \
            --extra-vars "@$RUNNER_TEMP/vars.yml"

      - name: Clean up temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/azure_key.pem" "$RUNNER_TEMP/vars.yml" "$RUNNER_TEMP/inventory.ini"
