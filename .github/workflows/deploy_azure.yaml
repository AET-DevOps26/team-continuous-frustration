name: Deploy Docker Images

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Azure
      url: 'https://${{ vars.AZURE_PUBLIC_IP }}.nip.io'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy infra directory to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          source: "./infra"
          target: /home/${{ vars.AZURE_USER }}/team-continuous-frustration

      - name: SSH to VM and Create .env.prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            ENV_FILE="/home/${{ vars.AZURE_USER }}/.env.prod"
            rm -f "$ENV_FILE"
            touch "$ENV_FILE"

            echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}" >> "$ENV_FILE"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> "$ENV_FILE"

            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$ENV_FILE"
            echo "JWT_EXPIRATION_MS=${{ vars.JWT_EXPIRATION_MS }}" >> "$ENV_FILE"
            echo "SESSION_EXPIRATION_MS=${{ vars.SESSION_EXPIRATION_MS }}" >> "$ENV_FILE"

            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> "$ENV_FILE"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> "$ENV_FILE"

            echo "LOGOS_API_KEY=${{ secrets.LOGOS_API_KEY }}" >> "$ENV_FILE"
            echo "LLM_BASE_URL=${{ vars.LLM_BASE_URL }}" >> "$ENV_FILE"
            echo "LLM_MODEL=${{ vars.LLM_MODEL }}" >> "$ENV_FILE"

            echo "FRONTEND_URL=${{ vars.AZURE_PUBLIC_IP }}.nip.io" >> "$ENV_FILE"
            echo "CORS_ALLOWED_ORIGINS=https://${{ vars.AZURE_PUBLIC_IP }}.nip.io" >> "$ENV_FILE"
            echo "VITE_API_BASE_URL=https://${{ vars.AZURE_PUBLIC_IP }}.nip.io" >> "$ENV_FILE"

            echo "--- Validating .env.prod (keys only) ---"
            if [ ! -s "$ENV_FILE" ]; then
              echo "ERROR: .env.prod is missing or empty!" && exit 1
            fi
            grep -o '^[^=]*' "$ENV_FILE"
            echo "--- .env.prod written successfully ($(wc -l < "$ENV_FILE") lines) ---"

      - name: SSH to VM and Execute Docker-Compose Up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            ENV_FILE="/home/${{ vars.AZURE_USER }}/.env.prod"
            INFRA_DIR="/home/${{ vars.AZURE_USER }}/team-continuous-frustration/infra"

            echo "Verifying .env.prod exists..."
            if [ ! -s "$ENV_FILE" ]; then
              echo "ERROR: .env.prod is missing or empty at $ENV_FILE" && exit 1
            fi

            echo "Stopping all running containers..."
            docker stop $(docker ps -q) || true
            docker rm $(docker ps -aq) || true
            echo "Pruning unused Docker resources..."
            docker system prune -af
            echo "Logging into Docker registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Starting Docker Compose..."
            cd "$INFRA_DIR"
            docker compose -f docker-compose.azure.yml --env-file="$ENV_FILE" up --pull=always -d
